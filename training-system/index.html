<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia La Estancia — Sistema de Capacitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Archivo:wght@300;400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#080706;
    --carbon:#100e0c;
    --panel:#17140f;
    --panel2:#1d1914;
    --borde:#2c261d;
    --borde2:#39301f;
    --oro:#c9a04e;
    --oro-claro:#e6c87f;
    --oro-tenue:rgba(201,160,78,.14);
    --hueso:#f3ece0;
    --vino:#8a2b29;
    --vino-claro:#b8453f;
    --texto:#cfc6b6;
    --texto-suave:#897f6e;
    --texto-tenue:#5d5547;
    --verde:#6a8a4e;
    --sombra:0 24px 60px -20px rgba(0,0,0,.8);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--negro);
    color:var(--texto);
    font-family:'Archivo',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,160,78,.06),transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%,rgba(138,43,41,.05),transparent 55%);
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position:sticky;top:0;z-index:200;
    background:rgba(8,7,6,.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--borde);
    padding:14px clamp(16px,4vw,40px);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand-logo{
    height:40px;width:auto;flex-shrink:0;
    background:#fff;padding:6px 10px;border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .brand-txt{min-width:0}
  .brand-txt h1{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;
    font-size:15px;letter-spacing:.5px;color:var(--hueso);
    text-transform:uppercase;line-height:1;white-space:nowrap;
  }
  .brand-txt p{
    font-size:10px;letter-spacing:2.5px;color:var(--oro);
    text-transform:uppercase;margin-top:3px;
  }
  .topbar-tag{
    font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--texto-suave);
    border:1px solid var(--borde2);border-radius:40px;padding:6px 14px;white-space:nowrap;
  }
  @media(max-width:640px){.topbar-tag{display:none}}

  /* ===== NAV TABS ===== */
  .nav{
    position:sticky;top:67px;z-index:190;
    background:rgba(16,14,12,.9);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--borde);
    display:flex;overflow-x:auto;scrollbar-width:none;
    padding:0 clamp(8px,3vw,28px);
  }
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    background:none;border:none;cursor:pointer;
    font-family:'Archivo Narrow',sans-serif;font-weight:600;
    font-size:13px;letter-spacing:1px;text-transform:uppercase;
    color:var(--texto-suave);padding:16px 18px;white-space:nowrap;
    border-bottom:2px solid transparent;transition:all .2s;position:relative;
  }
  .nav button .ix{
    font-family:'Fraunces',serif;font-size:11px;color:var(--texto-tenue);
    margin-right:7px;font-weight:600;
  }
  .nav button:hover{color:var(--texto)}
  .nav button.on{color:var(--oro-claro);border-bottom-color:var(--oro)}
  .nav button.on .ix{color:var(--oro)}

  /* ===== LAYOUT ===== */
  main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 120px}
  .view{display:none;animation:fade .45s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:3.5px;
    text-transform:uppercase;color:var(--oro);margin-bottom:14px;
    display:flex;align-items:center;gap:12px;
  }
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--oro)}
  h2.display{
    font-family:'Fraunces',serif;font-weight:900;
    font-size:clamp(30px,6vw,52px);line-height:1.02;color:var(--hueso);
    letter-spacing:-.5px;margin-bottom:18px;
  }
  h2.display em{font-style:italic;color:var(--oro)}
  .lead{font-size:clamp(15px,2vw,17.5px);color:var(--texto);max-width:60ch;margin-bottom:8px}
  .lead strong{color:var(--hueso);font-weight:600}

  .section-rule{height:1px;background:linear-gradient(90deg,var(--borde2),transparent);margin:40px 0}

  /* ===== HOME / HERO ===== */
  .hero{padding:clamp(20px,5vw,50px) 0 0}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:38px 0}
  @media(max-width:680px){.pillars{grid-template-columns:1fr}}
  .pillars-full .pillar{padding:24px 22px}
  .pillars-full .pillar p{font-size:13.5px;color:var(--texto);line-height:1.62}
  .pillars-full .pillar p b{color:var(--oro-claro);font-weight:600}
  .pillar{
    border:1px solid var(--borde);border-radius:14px;padding:22px 20px;
    background:linear-gradient(160deg,var(--panel),var(--carbon));position:relative;overflow:hidden;
  }
  .pillar::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--oro),transparent)}
  .pillar .pn{font-family:'Fraunces',serif;font-size:13px;color:var(--oro);font-weight:600}
  .pillar h3{font-family:'Fraunces',serif;font-size:21px;color:var(--hueso);margin:6px 0 8px;font-weight:600}
  .pillar p{font-size:13.5px;color:var(--texto-suave);line-height:1.5}

  .home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:10px}
  @media(max-width:680px){.home-grid{grid-template-columns:1fr}}
  .module-card{
    text-align:left;cursor:pointer;border:1px solid var(--borde);border-radius:16px;
    padding:26px 24px;background:linear-gradient(165deg,var(--panel),var(--carbon));
    transition:all .25s;position:relative;overflow:hidden;font-family:inherit;color:inherit;
  }
  .module-card:hover{border-color:var(--borde2);transform:translateY(-3px);box-shadow:var(--sombra)}
  .module-card .mc-ix{
    font-family:'Fraunces',serif;font-weight:900;font-size:40px;
    color:var(--oro-tenue);position:absolute;top:14px;right:20px;line-height:1;
  }
  .module-card .mc-tag{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--oro)}
  .module-card h3{font-family:'Fraunces',serif;font-size:23px;color:var(--hueso);margin:10px 0 8px;font-weight:600;max-width:14ch}
  .module-card p{font-size:13.5px;color:var(--texto-suave);max-width:34ch}
  .module-card .mc-go{margin-top:16px;font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro-claro);display:flex;align-items:center;gap:8px}
  .module-card .mc-go::after{content:"→";transition:transform .2s}
  .module-card:hover .mc-go::after{transform:translateX(5px)}

  /* ===== INDUCCION (días) ===== */
  .day-track{display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .day{
    border:1px solid var(--borde);border-radius:14px;overflow:hidden;
    background:linear-gradient(165deg,var(--panel),var(--carbon));
  }
  .day-head{
    display:flex;align-items:center;gap:18px;padding:20px 22px;cursor:pointer;
    transition:background .2s;
  }
  .day-head:hover{background:var(--panel2)}
  .day-num{
    flex-shrink:0;width:54px;height:54px;border-radius:12px;
    border:1px solid var(--borde2);display:grid;place-items:center;
    background:var(--oro-tenue);
  }
  .day-num span{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--oro-claro);line-height:1}
  .day-num small{display:block;font-family:'Archivo Narrow',sans-serif;font-size:8px;letter-spacing:1.5px;color:var(--oro);text-transform:uppercase;margin-top:1px}
  .day-head-txt{flex:1;min-width:0}
  .day-head-txt .dt-tag{font-family:'Archivo Narrow',sans-serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--oro)}
  .day-head-txt h3{font-family:'Fraunces',serif;font-size:21px;color:var(--hueso);font-weight:600;line-height:1.1;margin-top:2px}
  .day-toggle{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--borde2);display:grid;place-items:center;color:var(--oro);transition:transform .3s;font-size:15px}
  .day.open .day-toggle{transform:rotate(45deg)}
  .day-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .day.open .day-body{max-height:1400px}
  .day-body-inner{padding:4px 22px 24px;border-top:1px solid var(--borde)}
  .day-body-inner h4{
    font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--oro);margin:20px 0 10px;
    display:flex;align-items:center;gap:9px;
  }
  .day-body-inner h4::before{content:"";width:5px;height:5px;background:var(--oro);transform:rotate(45deg)}
  .check-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .check-list li{display:flex;gap:12px;font-size:14.5px;color:var(--texto);align-items:flex-start}
  .check-list li::before{
    content:"";flex-shrink:0;width:18px;height:18px;border-radius:5px;margin-top:1px;
    border:1px solid var(--borde2);background:var(--panel2);
  }
  .day-goal{
    margin-top:18px;padding:14px 16px;border-left:2px solid var(--oro);
    background:var(--oro-tenue);border-radius:0 8px 8px 0;font-size:13.5px;
  }
  .day-goal b{color:var(--oro-claro);font-family:'Archivo Narrow',sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:11px;display:block;margin-bottom:3px}

  /* ===== ROLE PLAYS ===== */
  .rp-intro{
    border:1px solid var(--borde2);border-radius:16px;padding:24px 26px;margin:28px 0;
    background:linear-gradient(160deg,var(--panel2),var(--carbon));
  }
  .rp-intro h3{font-family:'Fraunces',serif;font-size:22px;color:var(--hueso);margin-bottom:10px;font-weight:600}
  .rp-intro p{font-size:14.5px;color:var(--texto);max-width:62ch}
  .rp-intro .how{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
  @media(max-width:680px){.rp-intro .how{grid-template-columns:repeat(2,1fr)}}
  .rp-step{text-align:center;padding:14px 8px;border:1px solid var(--borde);border-radius:10px;background:var(--carbon)}
  .rp-step .s{font-family:'Fraunces',serif;font-size:20px;color:var(--oro);font-weight:900}
  .rp-step p{font-size:11.5px;color:var(--texto-suave);margin-top:4px;max-width:none}

  .rp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
  @media(max-width:680px){.rp-grid{grid-template-columns:1fr}}
  .rp-card{
    cursor:pointer;border:1px solid var(--borde);border-radius:14px;padding:20px;
    background:linear-gradient(165deg,var(--panel),var(--carbon));transition:all .22s;
    position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;
  }
  .rp-card:hover{border-color:var(--oro);transform:translateY(-2px);box-shadow:var(--sombra)}
  .rp-card.master{border-color:var(--vino)}
  .rp-card.master:hover{border-color:var(--vino-claro)}
  .rp-card .rp-n{font-family:'Fraunces',serif;font-weight:900;font-size:13px;color:var(--oro)}
  .rp-card.master .rp-n{color:var(--vino-claro)}
  .rp-card h4{font-family:'Fraunces',serif;font-size:19px;color:var(--hueso);font-weight:600;line-height:1.12}
  .rp-card .rp-skill{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-suave)}
  .rp-card .rp-diff{position:absolute;top:16px;right:18px;display:flex;gap:3px}
  .rp-card .rp-diff i{width:6px;height:6px;border-radius:50%;background:var(--borde2)}
  .rp-card .rp-diff i.f{background:var(--oro)}
  .rp-card.master .rp-diff i.f{background:var(--vino-claro)}

  /* MODAL role play */
  .modal-bg{
    position:fixed;inset:0;z-index:500;background:rgba(4,3,2,.86);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
  }
  .modal-bg.on{display:flex}
  .modal{
    background:linear-gradient(170deg,var(--panel2),var(--carbon));
    border:1px solid var(--borde2);border-radius:18px;max-width:680px;width:100%;
    margin:auto;box-shadow:var(--sombra);animation:pop .35s ease;position:relative;
  }
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(14px)}to{opacity:1;transform:none}}
  .modal-x{
    position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--borde2);background:var(--carbon);color:var(--oro);cursor:pointer;
    font-size:18px;display:grid;place-items:center;z-index:2;transition:all .2s;
  }
  .modal-x:hover{background:var(--vino);color:var(--hueso);border-color:var(--vino)}
  .modal-head{padding:30px 30px 22px;border-bottom:1px solid var(--borde)}
  .modal-head .mh-tag{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--oro);margin-bottom:8px}
  .modal-head h3{font-family:'Fraunces',serif;font-size:27px;color:var(--hueso);font-weight:600;line-height:1.05}
  .modal-head .mh-setup{margin-top:14px;font-size:14.5px;color:var(--texto);padding:13px 15px;background:var(--carbon);border-radius:9px;border-left:2px solid var(--oro)}
  .modal-body{padding:24px 30px 30px}
  .mb-block{margin-bottom:22px}
  .mb-block h4{font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .mb-block h4::before{content:"";width:5px;height:5px;background:var(--oro);transform:rotate(45deg)}
  .comanda{border:1px dashed var(--borde2);border-radius:10px;background:var(--carbon);padding:4px 0}
  .comanda .ci{display:flex;justify-content:space-between;gap:14px;padding:9px 16px;font-size:14px;border-bottom:1px solid var(--borde)}
  .comanda .ci:last-child{border-bottom:none}
  .comanda .ci .nm{color:var(--texto)}
  .comanda .ci .pr{font-family:'Archivo Narrow',sans-serif;color:var(--oro-claro);font-weight:600;white-space:nowrap}
  .clavar{list-style:none;display:flex;flex-direction:column;gap:9px}
  .clavar li{display:flex;gap:11px;font-size:14px;color:var(--texto);align-items:flex-start}
  .clavar li::before{content:"▸";color:var(--oro);flex-shrink:0;font-size:13px;margin-top:1px}
  .debrief{padding:16px 18px;border-radius:10px;background:var(--oro-tenue);border:1px solid var(--borde2)}
  .debrief .dl{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro);margin-bottom:6px}
  .debrief p{font-size:15px;color:var(--hueso);font-style:italic;font-family:'Fraunces',serif}

  /* ===== JEFE DE PISO ===== */
  .jp-block{border:1px solid var(--borde);border-radius:14px;padding:24px 26px;margin-bottom:16px;background:linear-gradient(165deg,var(--panel),var(--carbon))}
  .jp-block h3{font-family:'Fraunces',serif;font-size:22px;color:var(--hueso);font-weight:600;margin-bottom:12px;display:flex;align-items:baseline;gap:12px}
  .jp-block h3 .jn{font-family:'Fraunces',serif;font-size:14px;color:var(--oro)}
  .jp-block p{font-size:14.5px;color:var(--texto);margin-bottom:10px;max-width:64ch}
  .jp-block p strong{color:var(--hueso)}
  .jp-block ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .jp-block ul li{display:flex;gap:11px;font-size:14px;align-items:flex-start}
  .jp-block ul li::before{content:"▸";color:var(--oro);flex-shrink:0;margin-top:1px}
  .alert-box{border-left:2px solid var(--vino-claro);background:rgba(138,43,41,.1);padding:16px 18px;border-radius:0 8px 8px 0;margin:14px 0}
  .alert-box .al{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--vino-claro);margin-bottom:5px}
  .alert-box p{font-size:14px;color:var(--hueso);margin:0}

  /* tables scenario for rush */
  .mesas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 4px}
  @media(max-width:560px){.mesas-grid{grid-template-columns:1fr}}
  .mesa-c{border:1px solid var(--borde2);border-radius:10px;padding:14px 16px;background:var(--carbon)}
  .mesa-c .mc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .mesa-c .mc-h .mn{font-family:'Fraunces',serif;font-weight:600;color:var(--hueso);font-size:16px}
  .mesa-c .mc-h .badge{font-family:'Archivo Narrow',sans-serif;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:30px;font-weight:600}
  .badge.urge{background:var(--vino);color:var(--hueso)}
  .badge.calma{background:var(--oro-tenue);color:var(--oro-claro);border:1px solid var(--borde2)}
  .badge.prep{background:rgba(106,138,78,.2);color:var(--verde);border:1px solid rgba(106,138,78,.3)}
  .mesa-c p{font-size:13px;color:var(--texto-suave);margin:0}

  /* ===== GENERADOR BRIEFING ===== */
  .gen-wrap{margin-top:30px}
  .gen-intro{border:1px solid var(--borde2);border-radius:16px;padding:24px 26px;margin-bottom:22px;background:linear-gradient(160deg,var(--panel2),var(--carbon))}
  .gen-intro h3{font-family:'Fraunces',serif;font-size:22px;color:var(--hueso);font-weight:600;margin-bottom:8px}
  .gen-intro p{font-size:14.5px;color:var(--texto);max-width:64ch}
  .gen-form label{display:block;font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro);margin:18px 0 9px}
  .gen-form input,.gen-form textarea,.gen-form select{
    width:100%;background:var(--carbon);border:1px solid var(--borde2);border-radius:10px;
    color:var(--hueso);font-family:'Archivo',sans-serif;font-size:15px;padding:13px 15px;transition:border .2s;
  }
  .gen-form textarea{min-height:90px;resize:vertical;line-height:1.5}
  .gen-form input:focus,.gen-form textarea:focus,.gen-form select:focus{outline:none;border-color:var(--oro)}
  .gen-form input::placeholder,.gen-form textarea::placeholder{color:var(--texto-tenue)}
  .gen-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.gen-row{grid-template-columns:1fr}}
  .gen-btn{
    margin-top:22px;width:100%;cursor:pointer;border:none;border-radius:11px;
    background:linear-gradient(135deg,var(--oro),#a07e34);color:var(--negro);
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:1.5px;
    text-transform:uppercase;padding:16px;transition:all .2s;box-shadow:0 8px 24px -8px rgba(201,160,78,.5);
  }
  .gen-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px -8px rgba(201,160,78,.6)}
  .gen-btn:disabled{opacity:.6;cursor:wait}
  .gen-out{margin-top:26px;display:none}
  .gen-out.on{display:block;animation:fade .5s}
  .gen-out-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .gen-out-head .gl{font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:10px}
  .gen-out-head .gl::before{content:"";width:24px;height:1px;background:var(--oro)}
  .copy-btn{cursor:pointer;background:var(--carbon);border:1px solid var(--borde2);color:var(--oro-claro);font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 14px;border-radius:8px;transition:all .2s}

  /* ===== TIMER (sesión) ===== */

    position:fixed;bottom:22px;right:22px;z-index:300;

    display:flex;align-items:center;gap:9px;transition:transform .2s;
  }
  .timer-fab:hover{transform:translateY(-2px)}
  .timer-panel{
    position:fixed;bottom:80px;right:22px;z-index:300;width:280px;
    background:linear-gradient(170deg,var(--panel2),var(--carbon));
    border:1px solid var(--borde2);border-radius:16px;padding:22px;box-shadow:var(--sombra);

  .ses-row{display:flex;align-items:center;gap:16px;border:1px solid var(--borde);border-radius:11px;padding:14px 18px;background:var(--carbon)}

  .ses-txt h4{font-family:'Fraunces',serif;font-size:16px;color:var(--hueso);font-weight:600}
  .ses-txt p{font-size:13px;color:var(--texto-suave);margin-top:2px}

  footer p{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-tenue)}

  .cal-foco{font-family:'Archivo Narrow',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);text-align:right}
  .cal-tema{font-family:'Fraunces',serif;font-size:16px;color:var(--oro-claro);font-style:italic;line-height:1.25;padding-bottom:10px;border-bottom:1px solid var(--borde)}
  .cal-meta .cl,.cal-sect .cl,.cal-evi .cl{display:block;font-family:'Archivo Narrow',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-suave);margin-bottom:5px}
  .cal-resp{font-size:13.5px;color:var(--texto)}
  .cal-sect ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .cal-sect ul li{display:flex;gap:9px;font-size:13px;color:var(--texto);align-items:flex-start;line-height:1.4}
  .cal-sect ul li::before{content:"▸";color:var(--accent);flex-shrink:0}
  .cal-evi p{font-size:13px;color:var(--texto-suave);line-height:1.4}
  .cal-check{display:flex;align-items:center;gap:10px;margin-top:4px;padding:11px 13px;border:1px dashed var(--borde2);border-radius:9px;cursor:pointer;transition:all .2s}
  .cal-check:hover{border-color:var(--accent)}
  .cal-check input{width:18px;height:18px;accent-color:var(--oro);cursor:pointer;flex-shrink:0}
  .cal-check span{font-family:'Archivo Narrow',sans-serif;font-size:12px;letter-spacing:.5px;color:var(--texto-suave);text-transform:uppercase}
  .cal-check input:checked ~ span{color:var(--oro-claro)}
  .exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px}
  .exp-item{border:1px solid var(--borde);border-radius:12px;padding:20px;background:var(--carbon);position:relative}
  .exp-item::before{content:"";position:absolute;top:0;left:20px;width:30px;height:2px;background:var(--oro)}
  .exp-item h4{font-family:'Fraunces',serif;font-size:18px;color:var(--hueso);font-weight:600;margin-bottom:8px}
  .exp-item p{font-size:13px;color:var(--texto-suave);line-height:1.5}

  ::selection{background:var(--oro);color:var(--negro)}
</style>
</head>

const VIEWS = {home:viewHome, induccion:viewInduccion, roleplay:viewRoleplay, jefe:viewJefe, briefing:viewBriefing, sesion:viewSesion, calendario:viewCalendario};
let current = 'home';

function render(name){
  main.innerHTML = VIEWS[name]();
  const v = main.querySelector('.view'); if(v) v.classList.add('on');
  current = name;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===name));

  if(name==='induccion') wireDays();
  if(name==='roleplay') wireRP();
  if(name==='briefing') wireGen();
}

function openRP(n){
  const r = ROLEPLAYS.find(x=>x.n===n); if(!r) return;
  const comanda = r.comanda.map(c=>`<div class="ci"><span class="nm">${c.nm}</span><span class="pr">${c.pr}</span></div>`).join('');
  const mesas = r.mesas ? `<div class="mb-block"><h4>Las cuatro mesas — léelas antes de moverte</h4><div class="mesas-grid">${r.mesas.map(m=>`<div class="mesa-c"><div class="mc-h"><span class="mn">${m.mn}</span><span class="badge ${m.bclass}">${m.badge}</span></div><p>${m.txt}</p></div>`).join('')}</div></div>`:'';

      <div class="mh-setup">${r.setup}</div>

    <div class="modal-body">
      ${mesas}
      <div class="mb-block"><h4>Comanda objetivo — lo que debe lograr</h4><div class="comanda">${comanda}</div></div>
      <div class="mb-block"><h4>Qué debe clavar el mesero</h4><ul class="clavar">${r.clavar.map(c=>`<li>${c}</li>`).join('')}</ul></div>

    </div>`;
  modalBg.classList.add('on');
  document.body.style.overflow='hidden';
  document.getElementById('modalX').addEventListener('click', closeRP);
}
function closeRP(){ modalBg.classList.remove('on'); document.body.style.overflow=''; }
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeRP(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeRP(); });

/* ---------- TIMER ---------- */
const fab = document.getElementById('timerFab');
const panel = document.getElementById('timerPanel');
const clock = document.getElementById('timerClock');
let tMin=15, tLeft=15*60, tRun=false, tInt=null;
fab.addEventListener('click', ()=> panel.classList.toggle('on'));
document.getElementById('timerPresets').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#timerPresets button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); tMin=+b.dataset.m; resetTimer();
});
function fmt(s){const m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function tick(){
  if(tLeft<=0){clearInterval(tInt);tRun=false;document.getElementById('timerStart').textContent='Iniciar';clock.classList.add('warn');try{beep()}catch(e){}return;}
  tLeft--; clock.textContent=fmt(tLeft);
  clock.classList.toggle('warn', tLeft<=30);
}
document.getElementById('timerStart').addEventListener('click', function(){
  if(tRun){clearInterval(tInt);tRun=false;this.textContent='Continuar';}
  else{tRun=true;this.textContent='Pausar';tInt=setInterval(tick,1000);}
});
document.getElementById('timerReset').addEventListener('click', resetTimer);
function resetTimer(){clearInterval(tInt);tRun=false;tLeft=tMin*60;clock.textContent=fmt(tLeft);clock.classList.remove('warn');document.getElementById('timerStart').textContent='Iniciar';}
function beep(){const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.frequency.value=660;},200);setTimeout(()=>{o.stop();c.close();},500);}

/* ---------- GENERADOR DE BRIEFINGS (Claude API) ---------- */
function wireGen(){
  const btn=document.getElementById('genBtn');
  btn.addEventListener('click', generarBriefing);
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const txt=document.getElementById('briefPaper').innerText;
    navigator.clipboard.writeText(txt).then(()=>{
      const cb=document.getElementById('copyBtn');cb.textContent='¡Copiado!';
      setTimeout(()=>cb.textContent='Copiar texto',1800);
    });
  });
}

async function generarBriefing(){
  const tema=document.getElementById('genTema').value.trim();
  const turno=document.getElementById('genTurno').value;
  const tono=document.getElementById('genTono').value;
  const contexto=document.getElementById('genContexto').value.trim();
  const loading=document.getElementById('genLoading');
  const out=document.getElementById('genOut');
  const err=document.getElementById('genErr');
  const btn=document.getElementById('genBtn');

  err.classList.remove('on'); out.classList.remove('on');
  if(!tema){ err.textContent='Escribe primero de qué quieres hablar en el briefing.'; err.classList.add('on'); return; }

  loading.classList.add('on'); btn.disabled=true;

  const sys = `Eres el coach de liderazgo de La Estancia Argentina León, un steakhouse premium. Tu trabajo es ayudar a un jefe de piso a redactar el briefing perfecto para su equipo de meseros, ENSEÑÁNDOLE a comunicar como líder.

ESTRUCTURA OBLIGATORIA del briefing (la cultura de la casa). Úsala SIEMPRE, con estos 6 puntos en orden:
1. EL NÚMERO Y EL CONTEXTO — reservaciones, hora pico, mesas grandes, festejos del día.
2. LA META EMOCIONAL DEL DÍA — una frase tipo "hoy no se vende comida, hoy se vende ___". La meta del equipo NUNCA es dinero; es sensorial (memoria, hospitalidad, festejar a la mesa).
3. QUIÉN HACE QUÉ, QUIÉN APOYA A QUIÉN — estaciones y pares de apoyo pre-mapeados.
4. ANTICIPACIÓN "QUÉ HACER SI..." — mínimo 4 escenarios concretos del tema del día.
5. LA REGLA DEL 1 — resuelve antes de pedir ayuda.
6. EL CIERRE QUE ENCIENDE — una frase de propósito que prenda al equipo.

FILOSOFÍA de la casa: tres pilares — Hospitalidad, Disciplina, Profesionalismo. Modelo de confianza y flujo ("fluye fluye fluye"), no supervisión punitiva. Tono directo, firme e inspirador, pero NUNCA regañón ni corporativo.

REGLAS DE ESTILO:
- Español mexicano casual de restaurante, como habla un gerente real a su equipo.
- NADA de citas de libros ni referencias académicas. Todo se lee como cultura propia de La Estancia.
- Usa **negritas** (markdown) para las frases clave que el jefe debe enfatizar.
- Encabeza cada uno de los 6 puntos con su nombre en negritas y un tiempo sugerido entre paréntesis.
- Producto real para los ejemplos: cortes (Tomahawk $2,150, Rib-Eye Akaushi $1,350, Arrachera, Filete Estancia), vinos de la casa Julia y Camperos (empujarlos hasta agotar), display de postres, reseñas RateTap.
- Que sea LEÍBLE EN VOZ ALTA en círculo. Longitud: completo pero no eterno (el jefe lo lee en ~5-8 min).
- Termina con UNA línea de coaching para el jefe (precedida de "—") sobre cómo darlo mejor: dónde hacer pausa, a quién mirar, cómo bajar el tono para que pegue.`;

  const usr = `Arma el briefing.
TEMA QUE QUIERE TRATAR EL JEFE: ${tema}
TURNO/OCASIÓN: ${turno}
TONO DESEADO: ${tono}
${contexto?'CONTEXTO DEL DÍA: '+contexto:''}

Devuelve SOLO el briefing redactado y listo para leer, con los 6 puntos. Nada de preámbulos como "aquí está tu briefing".`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1600,
        system:sys,
        messages:[{role:"user",content:usr}]
      })
    });
    if(!resp.ok) throw new Error("status "+resp.status);
    const data = await resp.json();
    let text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    // markdown bold -> html
    let html = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    document.getElementById('briefPaper').innerHTML = html;
    out.classList.add('on');
    out.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(ex){
    err.textContent="No se pudo generar el briefing en este momento. Revisa tu conexión e inténtalo de nuevo. Si sigue fallando, escribe el tema con más detalle.";
    err.classList.add('on');
  }finally{
    loading.classList.remove('on'); btn.disabled=false;
  }
}

/* ---------- INIT ---------- */
render('jefe');
